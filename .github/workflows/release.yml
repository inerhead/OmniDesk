# Pipeline de versiones (SPEC 25). En cada push a main comprueba el código y las migraciones y, si
# todo pasa, crea el siguiente tag vX.Y.Z sobre ese commit y publica sus imágenes (SPEC 26 y 27).
# Prod solo se despliega desde esos tags: el job `deploy` (SPEC 28) entra por SSH al VPS y ejecuta
# /srv/omnidesk/bin/omnidesk-autodeploy <tag>. A mano sigue funcionando omnidesk-deploy <tag>.
name: release

on:
  push:
    branches: [main]

# Una ejecución a la vez: dos pushes seguidos no calculan el mismo número de tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /omnidesk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # El cliente de Prisma (src/generated) no está en git y el lint del API lo necesita.
      - run: pnpm --filter @omnidesk/api db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Aplica todas las migraciones sobre una base vacía, como hace el API al arrancar en prod, y
  # falla si schema.prisma tiene cambios sin migración.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        # La misma versión que infra/deploy/docker-compose.prod.yml. POSTGRES_USER es superusuario:
        # la migración de RLS (SPEC 12) lo exige.
        image: postgres:18
        env:
          POSTGRES_USER: omnidesk
          POSTGRES_PASSWORD: omnidesk
          POSTGRES_DB: omnidesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omnidesk -d omnidesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://omnidesk:omnidesk@localhost:5432/omnidesk
      DATABASE_APP_PASSWORD: ci-app-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --filter "@omnidesk/api..."
      - name: Aplicar las migraciones
        run: pnpm --filter @omnidesk/api db:deploy
      - name: Rol de la app (SPEC 12)
        run: pnpm --filter @omnidesk/api db:app-role
      - name: Sin deriva entre las migraciones y schema.prisma
        run: pnpm --filter @omnidesk/api exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

  tag:
    needs: [verify, migrations]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # El tag de este commit (nuevo o ya existente): el job `images` construye las imágenes de esa versión.
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Crear el siguiente tag
        id: tag
        run: |
          git fetch --tags --force origin
          existing=$(git tag --points-at "$GITHUB_SHA" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -n "$existing" ]; then
            echo "El commit ya tiene el tag $existing; no se crea otro."
            echo "version=$existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          next=$(git tag --list | sh .github/scripts/next-version.sh)
          git tag "$next" "$GITHUB_SHA"
          git push origin "refs/tags/$next"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "Tag $next creado sobre $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  # Construye y publica las imágenes de la versión y su bundle de despliegue en ghcr.io (SPEC 26 y
  # 27). Prod los descarga con `omnidesk-deploy <tag>`; el VPS no compila ni tiene código fuente.
  # Una versión publicada es inmutable: si la imagen de ese tag existe, no se reconstruye ni se
  # sobrescribe.
  images:
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.version }}
      - name: Nombres de las imágenes
        id: names
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          echo "api=$prefix/omnidesk-api" >> "$GITHUB_OUTPUT"
          echo "gateway=$prefix/omnidesk-gateway" >> "$GITHUB_OUTPUT"
          echo "deploy=$prefix/omnidesk-deploy" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: ¿Ya existen las imágenes de este tag?
        id: exists
        run: |
          for name in api gateway deploy; do
            case $name in
              api) ref="${{ steps.names.outputs.api }}:$VERSION" ;;
              gateway) ref="${{ steps.names.outputs.gateway }}:$VERSION" ;;
              deploy) ref="${{ steps.names.outputs.deploy }}:$VERSION" ;;
            esac
            if out=$(docker buildx imagetools inspect "$ref" 2>&1); then
              echo "$name=true" >> "$GITHUB_OUTPUT"
              echo "$ref ya existe: no se reconstruye."
            elif echo "$out" | grep -qiE 'not found|manifest unknown|name unknown|denied|unauthorized'; then
              # GHCR puede responder «denied» a un paquete que todavía no existe. Si fuera un fallo
              # real de permisos, el push de después falla con un mensaje claro.
              echo "$name=false" >> "$GITHUB_OUTPUT"
            else
              # Un error de red o del registro no equivale a «no existe»: sobrescribir una versión
              # publicada rompería la inmutabilidad.
              echo "No se pudo comprobar $ref:" >&2
              echo "$out" >&2
              exit 1
            fi
          done
      - name: Imagen del API
        id: build_api
        if: steps.exists.outputs.api == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: prod
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            APP_VERSION=${{ env.VERSION }}
          tags: ${{ steps.names.outputs.api }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.title=omnidesk-api
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      # BASE_PATH y VITE_API_URL quedan fijados en el build de la web: son los valores de dev y prod.
      # deploy.sh prod rechaza un .env.prod que los cambie.
      - name: Imagen del gateway
        id: build_gateway
        if: steps.exists.outputs.gateway == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/gateway/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            BASE_PATH=/omnidesk
            VITE_API_URL=
            APP_VERSION=${{ env.VERSION }}
          tags: ${{ steps.names.outputs.gateway }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.title=omnidesk-gateway
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway
      # Bundle de despliegue (SPEC 27): solo deploy.sh, el compose, backup.sh, la plantilla del .env,
      # omnidesk-deploy y omnidesk-autodeploy. El VPS no tiene código fuente y saca de aquí lo que
      # necesita para este tag.
      - name: Bundle de despliegue
        id: build_deploy
        if: steps.exists.outputs.deploy == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/deploy/Dockerfile.bundle
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: ${{ steps.names.outputs.deploy }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.title=omnidesk-deploy
      - name: Resumen
        run: |
          {
            echo "### Imágenes de $VERSION"
            echo
            echo "| Imagen | Referencia | Digest |"
            echo "| --- | --- | --- |"
            echo "| api | \`${{ steps.names.outputs.api }}:$VERSION\` | \`${{ steps.build_api.outputs.digest || 'ya existía' }}\` |"
            echo "| gateway | \`${{ steps.names.outputs.gateway }}:$VERSION\` | \`${{ steps.build_gateway.outputs.digest || 'ya existía' }}\` |"
            echo "| deploy | \`${{ steps.names.outputs.deploy }}:$VERSION\` | \`${{ steps.build_deploy.outputs.digest || 'ya existía' }}\` |"
            echo
            echo "Paquetes: https://github.com/${GITHUB_REPOSITORY_OWNER}?tab=packages&repo_name=${GITHUB_REPOSITORY#*/}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Conserva las 10 versiones más recientes de cada paquete (cada una pesa ~1 GB). Borrar versiones
  # exige que el repo tenga el rol Admin en «Manage Actions access» del paquete (Package settings);
  # con el rol Write que recibe por defecto, este job avisa pero no tumba el release.
  prune:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        package: [omnidesk-api, omnidesk-gateway, omnidesk-deploy]
    steps:
      - id: borrar
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: ${{ matrix.package }}
          package-type: container
          min-versions-to-keep: 10
      - name: Aviso si no se pudo limpiar
        if: steps.borrar.outcome == 'failure'
        run: echo "::warning::No se pudieron borrar versiones antiguas de ${{ matrix.package }}. Da el rol Admin al repo en Package settings → Manage Actions access."

  # Despliega el tag en prod (SPEC 28): entra por SSH al VPS con el usuario y la contraseña de los
  # secretos y ejecuta omnidesk-autodeploy, que hace el backup previo, el despliegue y, si falla, el
  # rollback. El resultado sale de su última línea (OMNIDESK_RESULTADO=…). Sin secretos, avisa y no
  # se conecta. Activación, pausa y rollback fallido: docs/despliegue.md → "Despliegue automático".
  deploy:
    needs: [tag, images]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # Nunca dos despliegues a la vez; uno en curso no se cancela.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      # Los secretos no se pueden usar en un `if:`: se comprueban aquí.
      - name: ¿Hay acceso al VPS?
        id: access
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          missing=""
          for name in VPS_HOST VPS_USER VPS_PASSWORD VPS_KNOWN_HOSTS; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Despliegue automático sin configurar (faltan los secretos:$missing). $VERSION no se desplegó; hazlo a mano con omnidesk-deploy."
            echo "### Despliegue de $VERSION: sin configurar" >> "$GITHUB_STEP_SUMMARY"
            echo "Faltan los secretos:$missing. Ver docs/despliegue.md → «Despliegue automático»." >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Instalar sshpass
        if: steps.access.outputs.ok == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Desplegar en el VPS
        if: steps.access.outputs.ok == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          # sshpass -e la lee de aquí: nunca va en la línea de comandos.
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          known_hosts=$(mktemp)
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$known_hosts"
          # Huella fijada: nunca se acepta una desconocida ni se envía la contraseña a otro servidor.
          set +e
          sshpass -e ssh \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" -o GlobalKnownHostsFile=/dev/null \
            -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 \
            -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=4 \
            "$VPS_USER@$VPS_HOST" /srv/omnidesk/bin/omnidesk-autodeploy "$VERSION" 2>&1 | tee autodeploy.out
          code=${PIPESTATUS[0]}
          set -e

          line=$(grep -E '^OMNIDESK_RESULTADO=' autodeploy.out | tail -n 1 || true)
          result=$(echo "$line" | sed -nE 's/^OMNIDESK_RESULTADO=([a-z_]+).*/\1/p')
          in_use=$(echo "$line" | sed -nE 's/.* en_uso=([^ ]+).*/\1/p')
          case $result in
            desplegado) title="✅ $VERSION desplegado" ;;
            pausado) title="⏸ Pausado: $VERSION no se desplegó"
              echo "::warning::Despliegue automático pausado en el VPS (/srv/omnidesk/autodeploy.paused). $VERSION no se desplegó." ;;
            omitido) title="⏭ Omitido: $VERSION no es posterior a la versión en uso"
              echo "::warning::$VERSION no es posterior a la versión en uso ($in_use): no se desplegó." ;;
            rollback) title="↩ $VERSION falló: rollback a $in_use"
              echo "::error::El despliegue de $VERSION falló y se volvió a $in_use. Mira la salida de este paso." ;;
            fallo_sin_cambios) title="❌ $VERSION falló antes de tocar nada; sigue $in_use"
              echo "::error::El despliegue de $VERSION falló antes de levantar contenedores. Sigue en uso $in_use." ;;
            fallo_sin_rollback) title="🚨 $VERSION falló y el rollback también: despliegue automático pausado"
              echo "::error::Falló el despliegue de $VERSION y el rollback. Restaura el backup previo y la versión a mano: docs/despliegue.md → «Si el rollback automático falla»." ;;
            fallo_backup) title="❌ Falló el backup previo: $VERSION no se desplegó"
              echo "::error::Falló el backup previo en el VPS: $VERSION no se desplegó." ;;
            ocupado) title="❌ Había otro despliegue en curso: $VERSION no se desplegó"
              echo "::error::Había otro despliegue en curso en el VPS: $VERSION no se desplegó. Despliégalo a mano o espera al siguiente." ;;
            # 255: ssh; 5 y 6: sshpass (contraseña incorrecta, huella desconocida).
            *) if [ "$code" -eq 255 ] || [ "$code" -eq 5 ] || [ "$code" -eq 6 ]; then
                 title="❌ No se pudo conectar al VPS"
                 echo "::error::Fallo de SSH (conexión, contraseña o huella del servidor). Revisa los secretos VPS_*."
               else
                 title="❌ Resultado desconocido (código $code)"
                 echo "::error::No llegó el resultado de omnidesk-autodeploy. Mira /srv/omnidesk/autodeploy.log en el VPS."
               fi ;;
          esac
          {
            echo "### Despliegue: $title"
            echo
            [ -n "$in_use" ] && echo "Versión en uso en prod: \`$in_use\`"
            echo
            echo "Registro en el VPS: \`/srv/omnidesk/autodeploy.log\` y \`/srv/omnidesk/autodeploy/$VERSION.out\`."
          } >> "$GITHUB_STEP_SUMMARY"
          case $result in desplegado | pausado | omitido) exit 0 ;; *) exit 1 ;; esac
