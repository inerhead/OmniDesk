name: omnidesk

services:
  postgres:
    container_name: omnidesk-postgres
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omnidesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omnidesk}
      POSTGRES_DB: ${POSTGRES_DB:-omnidesk}
    ports:
      - '${POSTGRES_HOST_PORT:-5532}:5432'
    volumes:
      # Postgres 18 guarda los datos bajo /var/lib/postgresql (ya no en /var/lib/postgresql/data).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  # Adjuntos (SPEC 14). S3 en el host: http://localhost:9050; consola: http://localhost:9051.
  minio:
    container_name: omnidesk-minio
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-omnidesk}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-omnidesk-dev-secret}
    ports:
      - '${MINIO_HOST_PORT:-9050}:9000'
      - '${MINIO_CONSOLE_HOST_PORT:-9051}:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    container_name: omnidesk-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    env_file: .env
    ports:
      - '${API_HOST_PORT:-5001}:5001'
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
        required: false
    volumes:
      - ./apps/api/src:/repo/apps/api/src
      - ./apps/api/prisma:/repo/apps/api/prisma
      - ./apps/api/scripts:/repo/apps/api/scripts
      - ./apps/api/test:/repo/apps/api/test
      - ./packages/contracts/src:/repo/packages/contracts/src
      # turbo.json filtra el entorno en modo estricto; sin este montaje el contenedor usa la copia de la imagen.
      - ./turbo.json:/repo/turbo.json

  web:
    container_name: omnidesk-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    environment:
      BASE_PATH: ${BASE_PATH:-/omnidesk}
      VITE_API_URL: ${VITE_API_URL:-}
    ports:
      - '5173:5173'
    depends_on:
      - api
    volumes:
      - ./apps/web/src:/repo/apps/web/src
      - ./apps/web/vite.config.ts:/repo/apps/web/vite.config.ts
      - ./apps/web/public:/repo/apps/web/public
      - ./packages/contracts/src:/repo/packages/contracts/src

  caddy:
    container_name: omnidesk-caddy
    image: caddy:2
    environment:
      WEB_UPSTREAM: ${WEB_UPSTREAM:-web:5173}
    ports:
      - '${GATEWAY_HOST_PORT:-8080}:80'
    depends_on:
      - api
      - web
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro

  # Build de producción de la web servido por `vite preview`, para verificar la PWA.
  # Uso: WEB_UPSTREAM=web-preview:4173 docker compose --profile pwa up
  web-preview:
    container_name: omnidesk-web-preview
    profiles: [pwa]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    environment:
      NODE_ENV: production
      BASE_PATH: ${BASE_PATH:-/omnidesk}
      VITE_API_URL: ${VITE_API_URL:-}
    command:
      - sh
      - -c
      - pnpm exec turbo run build --filter=@omnidesk/web... && pnpm --filter @omnidesk/web preview
    ports:
      - '4173:4173'
    volumes:
      - ./apps/web/src:/repo/apps/web/src
      - ./apps/web/vite.config.ts:/repo/apps/web/vite.config.ts
      - ./apps/web/public:/repo/apps/web/public
      - ./packages/contracts/src:/repo/packages/contracts/src

  # Túnel con dominio fijo (el hostname se configura en Cloudflare). Comparte la red de
  # caddy: en el panel del túnel, el servicio público debe apuntar a http://localhost:80.
  cloudflared:
    container_name: omnidesk-cloudflared
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    network_mode: service:caddy
    depends_on:
      - caddy
    command: tunnel --protocol ${CLOUDFLARE_TUNNEL_PROTOCOL:-http2} --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}

volumes:
  pgdata:
  miniodata:
