# Producción en el VPS: un proyecto Compose aislado por entorno (red, volumen pgdata y backups propios).
# Se ejecuta desde la raíz del repo (lo hace infra/deploy/deploy.sh):
#
#   docker compose -p omnidesk-dev  --env-file /srv/omnidesk/.env.dev  -f infra/deploy/docker-compose.prod.yml up -d
#   docker compose -p omnidesk-prod --env-file /srv/omnidesk/.env.prod -f infra/deploy/docker-compose.prod.yml up -d
#
# Solo `gateway` publica un puerto, y solo en 127.0.0.1: el Nginx del servidor termina TLS y
# reenvía <BASE_PATH>/* a 127.0.0.1:${GATEWAY_HOST_PORT}. Ver docs/despliegue.md.

x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER:?falta POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB:?falta POSTGRES_DB}

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment: *postgres-env
    # Sin `ports`: solo accesible dentro de la red del proyecto.
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: prod
      args:
        APP_VERSION: ${APP_VERSION:-}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_PORT: ${API_PORT:-5001}
      # POSTGRES_PASSWORD sin caracteres especiales de URL (docs/despliegue.md genera una hex).
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Rol de aplicación sin BYPASSRLS (SPEC 12); el API fija su contraseña al arrancar.
      DATABASE_APP_PASSWORD: ${DATABASE_APP_PASSWORD:?falta DATABASE_APP_PASSWORD}
      DATABASE_APP_URL: postgresql://omnidesk_app_login:${DATABASE_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEMO_MODE: ${DEMO_MODE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:?falta CORS_ORIGINS}
      SIMULATED_PROVIDER_FAILURE_RATE: ${SIMULATED_PROVIDER_FAILURE_RATE:-0}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?falta GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?falta GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:?falta GOOGLE_CALLBACK_URL}
      CHANNEL_SECRETS_KEY: ${CHANNEL_SECRETS_KEY:?falta CHANNEL_SECRETS_KEY}
      WHATSAPP_GRAPH_VERSION: ${WHATSAPP_GRAPH_VERSION:-v25.0}
      N8N_WEBHOOK_ALLOWED_HOSTS: ${N8N_WEBHOOK_ALLOWED_HOSTS:-}
      APP_URL: ${APP_URL:?falta APP_URL}
      PUBLIC_BASE_PATH: ${PUBLIC_BASE_PATH:?falta PUBLIC_BASE_PATH}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-2}
      ATTACHMENT_STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-omnidesk-attachments}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      ATTACHMENT_INBOUND_MAX_BYTES: ${ATTACHMENT_INBOUND_MAX_BYTES:-26214400}
      # Vacías: Web Push queda deshabilitado. Las tres deben ir juntas.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      # La imagen no trae curl: fetch de Node 24.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + process.env.API_PORT + '/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      # `prisma migrate deploy` corre antes de aceptar peticiones.
      start_period: 60s

  gateway:
    build:
      context: ../..
      dockerfile: infra/gateway/Dockerfile
      args:
        BASE_PATH: ${BASE_PATH:?falta BASE_PATH}
        VITE_API_URL: ${VITE_API_URL:-}
    environment:
      API_PORT: ${API_PORT:-5001}
    restart: unless-stopped
    ports:
      - '127.0.0.1:${GATEWAY_HOST_PORT:?falta GATEWAY_HOST_PORT}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1${BASE_PATH}/']
      interval: 30s
      timeout: 5s
      retries: 3

  # Comparte la red del gateway: en Cloudflare el servicio sigue siendo http://localhost:80.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    network_mode: service:gateway
    depends_on:
      gateway:
        condition: service_healthy
    command: tunnel --protocol ${CLOUDFLARE_TUNNEL_PROTOCOL:-http2} --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?falta CLOUDFLARE_TUNNEL_TOKEN}

  # Adjuntos (SPEC 14). Sin consola; S3 solo en 127.0.0.1 (administración por túnel SSH).
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?falta MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?falta MINIO_ROOT_PASSWORD}
    ports:
      - '127.0.0.1:${MINIO_HOST_PORT:?falta MINIO_HOST_PORT}:9000'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

  # pg_dump -Fc diario a las 03:00 (hora del servidor), conserva los 7 más recientes.
  # Backup inmediato: docker compose ... run --rm backup now
  backup:
    image: postgres:18
    restart: unless-stopped
    entrypoint: ['sh', '/usr/local/bin/omnidesk-backup.sh']
    environment:
      <<: *postgres-env
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      OMNIDESK_ENV: ${OMNIDESK_ENV:?falta OMNIDESK_ENV}
      BACKUP_KEEP: 7
    volumes:
      - ./backup.sh:/usr/local/bin/omnidesk-backup.sh:ro
      - ${BACKUP_DIR:?falta BACKUP_DIR}:/backups
      - miniodata:/media:ro
      # Misma zona horaria que el servidor: "03:00" es la hora local del VPS.
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
